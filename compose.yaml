services:
  duld:
    build:
      target: production
    volumes:
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DULD_CONFIG_FILE}
        target: /mnt/duld.yaml
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${DULD_HOST}:${DULD_PORT}:80"
    logging:
      driver: journald
      options:
        tag: duld-duld
    command: /app/.venv/bin/python3 -m duld --settings=/mnt/duld.yaml
