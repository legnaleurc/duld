services:
  duld:
    volumes:
      - type: bind
        source: ${DULD_DRIVE_FILE}
        target: /mnt/drive.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DULD_DRIVE_CONFIG_PATH}
        target: /mnt/config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DULD_DRIVE_DATA_PATH}
        target: /mnt/data
        bind:
          create_host_path: false
